[build]
  command = "npm install && npm --prefix server install && npm --prefix client install && npm --prefix client run build"
  publish = "client/dist"
  functions = "server/functions"

[build.processing]
  skip_processing = true

[build.processing.html]
  pretty_urls = false

[build.processing.forms]
  html_disable = true

[functions]
  node_bundler = "esbuild"
  included_files = ["server/**"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200